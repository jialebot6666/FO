[versions]
# 版本号一律不带 V 前缀（V6.25 之前的写法已废弃，见 AGENTS.md「命名规范」）。
# 构建产物名 = FO-<mod-version>-<minecraft>，如 6.25 + 1.21.11 -> FO-6.25-1.21.11.jar
# 正式版 = 纯版本号（如 6.7）；测试版 = 正式版号 + pN（如 6.7p37），未完成/待验证的改动一律带 p，
# 只有经用户明确确认后才能去掉 p 定为正式版（见 AGENTS.md「命名规范」第 0 条）。
mod-version = "6.7p39"

# Fabric (https://fabricmc.net/develop)
jdk = "21"
minecraft = "1.21.11"
yarn = "1.21.11+build.3"
fabric-loader = "0.18.2"

# Loom (https://github.com/FabricMC/fabric-loom)
loom = "1.15.5"

# Meteor (https://github.com/MeteorDevelopment/meteor-client/)
meteor = "1.21.11-SNAPSHOT"

# Mods

[libraries]
# Fabric base
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
yarn = { module = "net.fabricmc:yarn", version.ref = "yarn" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }

# Meteor client
meteor-client = { module = "meteordevelopment:meteor-client", version.ref = "meteor" }

# Mods

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
