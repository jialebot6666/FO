# 防呆：阻止「构建产物 / 第三方二进制」再次被提交进仓库。
#
# 背景：本仓库历史上曾把 110 个 releases/*.jar（148.6 MiB）提交进 git，
# 已于 2026-10-13 用 git filter-repo 剥离。本工作流用于防止复发。
#
# 允许入库的二进制是明确的少数几项，见下方 ALLOW 列表；
# 新增任何二进制前，先问「它是源码级依赖还是构建产物」。
name: Repository Guards

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: 结构与二进制守门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建产物不应入库
        run: |
          set -euo pipefail
          # 除下方 ALLOW 外，任何 jar/zip/exe/dll(非 natives) 都视为构建产物
          # 注意：natives/windows 下的 dll 是 JNI 原生库，属于源码级依赖，单独放行。
          forbidden=$(git ls-files \
            | grep -Ei '\.(jar|zip|7z|rar|exe|msi|deb|rpm|dmg|apk|class)$' \
            | grep -v '^gradle/wrapper/gradle-wrapper.jar$' \
            | grep -v '^libs/' \
            || true)
          if [ -n "$forbidden" ]; then
            echo "::error::以下文件是构建产物或不应入库的二进制，不应提交："
            echo "$forbidden" | sed 's/^/  - /'
            echo "::error::构建产物请走 GitHub Releases（见 docs/ci.md）。若确属源码级依赖，请先更新 .gitignore 的放行规则并在 PR 里说明原因。"
            exit 1
          fi
          echo "OK：无构建产物入库"

      - name: 允许入库的二进制有据可查
        run: |
          set -euo pipefail
          # libs/ 与 natives/ 是源码级依赖（理由见 docs/ci.md），天然放行；
          # 这里校验的是「理由有没有写进文档」，防止白名单失守成无脑放行。
          # 文件名用通配而非硬编码：换 Baritone 版本不必改 workflow。
          doc=docs/ci.md
          [ -f "$doc" ] || { echo "::error::缺少 $doc，无法核对二进制白名单的理由"; exit 1; }
          missing=0
          if ls libs/*.jar >/dev/null 2>&1; then
            grep -qi 'baritone' "$doc" || { echo "::error::$doc 未登记 baritone 的入库原因"; missing=1; }
          fi
          if ls src/main/resources/natives/windows/*.dll >/dev/null 2>&1; then
            grep -qi 'cubiomes' "$doc" || { echo "::error::$doc 未登记 cubiomes DLL 的入库原因"; missing=1; }
          fi
          [ "$missing" -eq 0 ] && echo "OK：白名单已在 docs/ci.md 登记"
          exit "$missing"

      - name: 仓库结构未被破坏
        run: |
          set -euo pipefail
          # Gradle 工程必须在仓库根（2026-10-13 从 fo/ 上提）。
          # 嵌套 .github/ 是 GitHub 不读的「死文件」，绝不允许复现。
          if [ -d fo ]; then
            echo "::error::检测到 fo/ 目录。Gradle 工程应在仓库根，不要重新引入 fo/ 子目录布局。"
            exit 1
          fi
          if [ -d .github/workflows/.github ] || [ -d src/.github ]; then
            echo "::error::检测到嵌套的 .github 目录。GitHub 只读根目录 .github/，嵌套的是永远不执行的死文件。"
            exit 1
          fi
          echo "OK：结构正常（Gradle 工程在仓库根）"

      - name: 根目录必备文件齐全
        run: |
          set -euo pipefail
          for f in README.md LICENSE build.gradle.kts settings.gradle.kts gradlew .gitignore; do
            if [ ! -f "$f" ]; then
              echo "::error::仓库根缺少 $f"
              exit 1
            fi
          done
          echo "OK：根目录文件齐全"

      - name: 工作流里没有硬编码的版本号
        run: |
          set -euo pipefail
          # 版本串一旦写进 workflow，改版本号时就会漏改。统一从 libs.versions.toml 解析。
          bad=$(grep -rnE "^[^#]*mod-version[[:space:]]*[=:][[:space:]]*[0-9]|^[^#]*minecraft[[:space:]]*[=:][[:space:]]*[0-9]" \
                .github/workflows/ || true)
          if [ -n "$bad" ]; then
            echo "::error::工作流里硬编码了版本号，必须改为从 gradle/libs.versions.toml 解析："
            echo "$bad" | sed 's/^/  - /'
            exit 1
          fi
          echo "OK：无硬编码版本号"
