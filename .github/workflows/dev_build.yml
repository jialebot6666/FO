name: dev_build

on:
  push:
    paths:
      - 'fo/**'
      - '.github/workflows/dev_build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew
        working-directory: fo

      - name: 编译（含全部单元测试）
        working-directory: fo
        run: ./gradlew build --stacktrace

      - name: 收集产物（排除 sources/mappings）
        run: |
          mkdir -p out
          find fo/build/libs -name '*.jar' ! -name '*-sources*' ! -name '*-mappings*' -exec cp {} out/ \;
          ls -la out/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: FO-build
          path: out/*.jar
          retention-days: 30
