# CI：push / PR 到 main 时自动编译打包，产物作为 Actions artifact 留存 30 天。
#
# 发版仍走手动命令（gh release create），见
# .github/skills/fo-development/references/build-and-release.md。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 从 libs.versions.toml 读，与 build.gradle.kts 的 toolchain 同源，升 JDK 只改那一处
      - name: 解析 JDK 版本
        id: jdk
        run: |
          v=$(grep -E '^jdk[[:space:]]*=' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          [ -n "$v" ] || { echo "::error::libs.versions.toml 里没有 versions.jdk"; exit 1; }
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "使用 JDK ${v}"

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # assemble 不触发 test，只验证「能编译、能打包」。单测本地 ./gradlew test 自检。
      - name: 编译打包
        run: ./gradlew assemble --stacktrace --no-daemon

      - name: 收集产物
        run: |
          set -euo pipefail
          mkdir -p dist
          find build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-mappings.jar' \
            -exec cp {} dist/ \;
          ls -la dist/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: FO-jar
          path: dist/*.jar
          retention-days: 30
          if-no-files-found: error
